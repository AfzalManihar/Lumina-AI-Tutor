<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05060f" />
    <meta name="description" content="Lumina is an AI tutor that answers from your own study documents and shows the exact passage behind every answer." />
    <meta name="author" content="Afzal Manihar" />
    <title>Lumina AI Tutor by Afzal Manihar</title>
  </head>
  <body>
    <div id="root"></div>
    <script>try{var t=localStorage.getItem("lumina-theme");if(t==="light"||t==="system")document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");if(t==="system")document.documentElement.removeAttribute("data-theme")}catch(e){}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
